name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -v --tb=line

      - name: Run integration tests (real NeonDB)
        if: env.NEON_URL != ''
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: python3 -m pytest tests/integration/ -v --tb=line
