name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  statuses: write

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout the CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/kagami
            source /home/ubuntu/kagami-env/bin/activate
            git pull origin main
            pip install -q -r requirements.txt
            # Validate the Caddyfile before touching the live server
            caddy validate --config Caddyfile --adapter caddyfile || exit 1
            sudo cp Caddyfile /etc/caddy/Caddyfile
            sudo systemctl restart streamlit-kagami
            sudo systemctl reload caddy
            # Streamlit cold-starts slowly on the 1-CPU VM: poll until healthy.
            healthy=""
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:8501/aqi/_stcore/health > /dev/null 2>&1; then
                healthy="yes"
                break
              fi
              echo "Waiting for streamlit (attempt $attempt/12)..."
              sleep 5
            done
            [ -n "$healthy" ] || { echo "❌ streamlit did not become healthy"; exit 1; }
            # Health check through Caddy (/aqi/ prefix)
            curl -fsS -o /dev/null https://kagami.tafita.online/aqi/_stcore/health || echo "⚠️ public health check failed — Caddy may still be starting"
            echo "✅ Deployed $(git rev-parse --short HEAD)"

      # workflow_run workflows never appear in the commit's check suite on
      # their own. Publish a commit status so "CD / deploy" shows up on the
      # commit (and can be used as a branch-protection gate).
      - name: Report success to commit checks
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'CD / deploy',
              description: 'Deployed to VM',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Report failure to commit checks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'CD / deploy',
              description: 'Deployment to VM failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
