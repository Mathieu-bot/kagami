[theme]
base = "light"
primaryColor = "#1E88E5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1c2b36"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = true
# Multi-app platform: this app is served under /aqi/ by Caddy.
baseUrlPath = "aqi"

[browser]
gatherUsageStats = false
